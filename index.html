<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUSICFLIX</title>

  <!-- Site CSS -->
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">

  <!-- Owl Carousel CSS (CDN updated) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/owl.carousel@2.3.4/dist/assets/owl.carousel.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/owl.carousel@2.3.4/dist/assets/owl.theme.default.min.css">

  <meta name="description" content="MusicFlix - exemplo de site com carrossel de álbuns">
</head>
<body>
  <header>
    <div class="container header-content">
      <h1 class="logo">MusicFlix</h1>
      <nav>
        <a href="#inicio">Início</a>
        <a href="#albuns">Álbuns</a>
        <a href="#categorias">Categorias</a>
        <a href="#sobre">Sobre</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="inicio" class="main-music">
      <div class="container">
        <div class="hero">
          <h2>Slipknot</h2>
          <p>Slipknot é uma banda norte-americana de metal formada em Des Moines, Iowa, em 1995. Seu estilo musical é o nu metal...</p>
        </div>

        <div class="buttons">
          <button id="ouvir" class="button">Ouvir
            <audio src="./assets/audio/slipknot.mp3"></audio>
          </button>
          <button id="parar" class="button">Parar</button>
        </div>
      </div>
    </section>

    <section id="albuns" class="albums">
      <div class="container">
        <h3>Álbuns</h3>
        <div class="owl-carousel">
          <div class="item"><img src="./assets/img/albuns/41157534_1.jpg" alt="AnaVitoria"></div>
          <div class="item"><img src="./assets/img/albuns/71RLzV5wabL._AC_SX425_.jpg" alt="James Arthur"></div>
          <div class="item"><img src="./assets/img/albuns//81Le2R1yAgL._AC_SL1400_.jpg" alt="Lady Gaga"></div>
          <div class="item"><img src="./assets/img/albuns//Beyoncé_-_Beyoncé.svg" alt="Beyoncé"></div>
          <div class="item"><img src="./assets/img/albuns/Capa_de_Músicas_para_Churrasco,_Vol._1.jpg" alt="Seu Jorge"></div>
          <div class="item"><img src="./assets/img/albuns/cd_cover.jpg" alt="João Gomes"></div>
          <div class="item"><img src="./assets/img/albuns/J._Quest_-_Jota_Quest.jpg" alt="J Quest"></div>
          <div class="item"><img src="./assets/img/albuns/na-praia.jpg" alt="Matheus e Kauan"></div>
          <div class="item"><img src="./assets/img/albuns/03defd2328dec2efab99f371f811ebdd.jpg" alt="Marília Mendonça"></div>
          <div class="item"><img src="./assets/img/albuns/29796.jpg" alt="Zion"></div>
        </div>
      </div>
    </section>

    <section id="categorias" class="categories">
      <div class="container">
        <h3>Categorias</h3>
        <div class="owl-carousel">
          <div class="item"><img src="./assets/img/categorias/bg-low.jpeg" alt="Rock"></div>
          <div class="item"><img src="./assets/img/categorias/historia-do-forro.jpeg" alt="Forró"></div>
          <div class="item"><img src="./assets/img/categorias/musicas-sertanejas.png" alt="Sertaneja"></div>
          <div class="item"><img src="./assets/img/categorias/SAMBA-RACA-1280x720-1.jpg" alt="Samba"></div>
          <div class="item"><img src="./assets/img/categorias/funk.jpg" alt="Funk"></div>
          <div class="item"><img src="./assets/img/categorias/jazz.jpeg" alt="Jazz"></div>
          <div class="item"><img src="./assets/img/categorias/pop.jpg" alt="Pop"></div>
          <div class="item"><img src="./assets/img/categorias/classica.jpg.crdownload" alt="Clássica"></div>
          <div class="item"><img src="./assets/img/categorias/musicas-internacionais.png" alt="Internacionais"></div>
          <div class="item"><img src="./assets/img/categorias/MPB.jpeg" alt="MPB"></div>
        </div>
      </div>
    </section>

    <section id="sobre" class="about">
      <div class="container">
        <h3>Sobre</h3>
        <p>Projeto exemplo desenvolvido por Jonatas Santana Souza.</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Desenvolvido por Jonatas Santana Souza</p>
    </div>
  </footer>

  <!-- jQuery (CDN updated) -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>

  <!-- Owl Carousel JS (CDN updated) -->
  <script src="https://cdn.jsdelivr.net/npm/owl.carousel@2.3.4/dist/owl.carousel.min.js"></script>

  <!-- Local JS -->
  <script src="./assets/js/owl/setup.js"></script>
  <script src="./assets/js/index.js"></script>

  <!-- Font Awesome Kit (unchanged) -->
  <script src="https://kit.fontawesome.com/e7d49c47b7.js" crossorigin="anonymous"></script>
</body>
</html>
